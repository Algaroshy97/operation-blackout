name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The probe drives a real browser. Without a cap, one hung Chromium burns the
    # default six-hour job limit on a run that will never finish.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Gameplay rules (headless, no browser needed).
      - name: Core behaviour tests
        run: node --test tests/test_core.js

      # Build integrity + bundle parse. Also drives the node suite.
      - name: Release build tests
        run: python -m unittest tests.test_release_build -v

      # Full end-to-end run in a real browser.
      - name: Install browser probe deps
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Build release
        run: python scripts/build.py .

      # 28 checks against a real browser: the deploy flow, AI reachability, station
      # reachability, the two through-floor regressions with their controls, ragdoll
      # lifecycle, and geometry growth. Verified to actually FAIL: reintroducing the
      # melee vertical gate bug turns no-melee-through-floor red and exits 1.
      - name: Live gameplay probe
        run: python scripts/probe_live.py

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: operation-blackout
          path: dist/Operation Blackout.html
