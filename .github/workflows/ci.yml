name: CI

# Two tiers on purpose.
#
#   fast lane  (always, every push/branch)   ~2 min
#       build determinism + all JS and Python tests + committed-artifact guard
#   full lane  (deliberate)                  ~19 min
#       browser acceptance matrix, only when asked:
#         - workflow_dispatch
#         - a PR carrying the `full-ci` label
#         - a push to a release/* branch
#
# The fast lane is the inner loop; the full lane is the pre-merge gate.
# scripts/gate.sh refuses to merge unless a full run exists for the exact head SHA,
# so the matrix can no longer be silently skipped (a PR once sat for hours with no
# run at all and `gh pr checks` reporting "no checks").
#
# dist/ is a deterministic derived artifact of `python scripts/build.py .` and is
# untracked (see .gitignore). The fast lane publishes the build hash so an
# acceptance receipt can be tied to a specific commit.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements.txt
      - name: No generated artifacts committed
        run: |
          tracked=$(git ls-files dist)
          if [ -n "$tracked" ]; then
            echo "::error::dist/ is generated by scripts/build.py; commit sources only."
            echo "$tracked"
            exit 1
          fi
      - name: JavaScript regression tests
        run: node --test tests/*.js
      - name: Release build and probe routing tests
        run: python -m unittest tests.test_release_build tests.test_probe_matrix tests.test_probe_shards -v
      - name: Build preview
        run: python scripts/build.py .
      - name: Record build hash
        id: hash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, pathlib
          p = pathlib.Path("dist/Operation Blackout.html")
          print("build_sha=" + hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Build artifact

          \`\`\`
          sha256  ${{ steps.hash.outputs.build_sha }}  dist/Operation Blackout.html
          commit  ${{ github.sha }}
          \`\`\`

          Full browser acceptance: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/') || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'requested for this head' || 'not requested — fast lane only' }}
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: operation-blackout-preview
          path: |
            dist/Operation Blackout.html
            dist/pwa/
          if-no-files-found: error

  browser:
    name: Browser / ${{ matrix.shard }}
    needs: build
    # Deliberate, not per push: see the header comment.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [gameplay, lifecycle, progression, mobile-offline]
    steps:
      - uses: actions/checkout@v4
        with:
          # Progression verifies legacy saves against historical builds.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: operation-blackout-preview
          path: dist/
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install browser probe deps
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Gameplay acceptance shard
        if: matrix.shard != 'mobile-offline'
        env:
          SHARD: ${{ matrix.shard }}
        run: python scripts/probe_live.py --shard "$SHARD"
      - name: Mobile controls, cold shot, and offline PWA
        if: matrix.shard == 'mobile-offline'
        run: python -m unittest tests.test_mobile_browser_features tests.test_first_shot_probe tests.test_pwa_build -v

  test:
    # Preserve the existing final check name. Skips are only a pass when the full
    # lane was not requested; a requested lane that did not succeed fails here.
    name: test
    needs: [build, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require all requested checks
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          FULL_REQUESTED: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/') || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          printf 'Fast checks: %s\nBrowser matrix: %s\nFull requested: %s\n' \
            "$BUILD_RESULT" "$BROWSER_RESULT" "$FULL_REQUESTED"
          test "$BUILD_RESULT" = success || exit 1
          if [ "$FULL_REQUESTED" = true ]; then
            test "$BROWSER_RESULT" = success || {
              echo "Browser acceptance was requested for this head and did not pass."; exit 1; }
          else
            echo "Fast lane only. Run scripts/gate.sh full before merging."
          fi
      - uses: actions/download-artifact@v4
        with:
          name: operation-blackout-preview
          path: dist/
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: operation-blackout
          path: dist/Operation Blackout.html
          if-no-files-found: error
      - name: Upload hosted PWA bundle
        uses: actions/upload-artifact@v4
        with:
          name: operation-blackout-pwa
          path: dist/pwa/
          if-no-files-found: error
